
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            color: #1e40af;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .task {
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .completed {
            color: #059669;
        }

        .pending {
            color: #d97706;
        }
        
.task-form {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

.task-form input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.task-form input:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.task label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.task label {
    flex: 1;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #b91c1c;
}

.delete-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.task {
    display: block;
}

.task-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.task-title {
    flex: 1;
    text-align: left;
    color: #1f2937;
    background: transparent;
    padding: 8px 0;
    font-size: 15px;
    font-weight: 600;
}

.task-title:hover {
    background: transparent;
    color: #2563eb;
}

.task-title.done {
    text-decoration: line-through;
    opacity: 0.55;
}

.task-description {
    margin: 12px 0 4px 28px;
    color: #475569;
    white-space: pre-wrap;
    line-height: 1.5;
}

.edit-btn {
    background: #e8efff;
    color: #1d4ed8;
    padding: 8px 12px;
}

.edit-btn:hover {
    background: #dbeafe;
}

.edit-form {
    margin-top: 14px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 8px;
    display: grid;
    gap: 10px;
}

.edit-form input,
.edit-form textarea {
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font: inherit;
}

.edit-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.cancel-btn {
    background: #64748b;
}

[hidden] {
    display: none !important;
}

.task-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 25px 0;
}

.task-form textarea {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font: inherit;
    resize: vertical;
}

.task-form button {
    align-self: flex-start;
}




    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>My Task Tracker</h1>
            <p>Manage your tasks with ASP.NET Core.</p>
             

<form id="taskForm" class="task-form">
    <input
        type="text"
        id="taskTitle"
        placeholder="Task title..."
        maxlength="200"
        required
    >

    <textarea
        id="taskDescription"
        placeholder="Task description..."
        rows="3"
    ></textarea>

    <button type="submit">
        Add Task
    </button>
</form>

   
            <button id="refreshBtn">
                Refresh Tasks
            </button>

            <p id="status"></p>

            <div id="taskList"></div>
        </div>
    </div>

    <script>
       
async function loadTasks() {
    const list = document.getElementById("taskList");
    const status = document.getElementById("status");

    list.replaceChildren();
    status.textContent = "Loading tasks...";

    try {
        const response = await fetch("/api/tasks");

        if (!response.ok) {
            throw new Error("Could not load tasks");
        }

        const tasks = await response.json();
        status.textContent = `${tasks.length} tasks found`;

        for (const task of tasks) {
            const card = document.createElement("div");
            card.className = "task";

            // HTML структура за всяка задача
            card.innerHTML = `
                <div class="task-header">
                    <input type="checkbox" class="task-check">
                    <button type="button" class="task-title"></button>
                    <button type="button" class="edit-btn">Edit</button>
                    <button type="button" class="delete-btn">Delete</button>
                </div>

                <p class="task-description" hidden></p>

                <form class="edit-form" hidden>
                    <input type="text" class="edit-title"
                           maxlength="200" required>

                    <textarea class="edit-description"
                              rows="3"
                              placeholder="Task description..."></textarea>

                    <div class="edit-actions">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            `;

            const checkbox = card.querySelector(".task-check");
            const title = card.querySelector(".task-title");
            const description = card.querySelector(".task-description");
            const editButton = card.querySelector(".edit-btn");
            const deleteButton = card.querySelector(".delete-btn");

            const form = card.querySelector(".edit-form");
            const titleInput = card.querySelector(".edit-title");
            const descriptionInput = card.querySelector(".edit-description");
            const cancelButton = card.querySelector(".cancel-btn");
            const saveButton = card.querySelector(".save-btn");

            // Показваме реалните данни от базата
            checkbox.checked = task.isCompleted;
            checkbox.setAttribute("aria-label", `Complete ${task.title}`);
            title.textContent = task.title;
            title.classList.toggle("done", task.isCompleted);

            description.textContent =
                task.description || "No description yet.";

            // Натискане на заглавието -> описание
            title.addEventListener("click", () => {
                description.hidden = !description.hidden;
            });

            // Checkbox -> PUT
            checkbox.addEventListener("change", async () => {
                checkbox.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: task.title,
                            description: task.description,
                            isCompleted: checkbox.checked
                        })
                    });

                    if (!response.ok) {
                        throw new Error("Update failed");
                    }

                    await loadTasks();

                } catch (error) {
                    checkbox.checked = task.isCompleted;
                    checkbox.disabled = false;
                    status.textContent = "Could not update task.";
                }
            });

            // Edit -> показваме формата
            editButton.addEventListener("click", () => {
                titleInput.value = task.title;
                descriptionInput.value = task.description || "";

                form.hidden = false;
                description.hidden = true;
                titleInput.focus();
            });

            // Cancel -> затваряме формата
            cancelButton.addEventListener("click", () => {
                form.hidden = true;
            });

            // Save -> изпращаме PUT към API
            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const newTitle = titleInput.value.trim();
                const newDescription = descriptionInput.value.trim();

                if (!newTitle) {
                    return;
                }

                saveButton.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: newTitle,
                            description: newDescription,
                            isCompleted: task.isCompleted
                        })
                    });

                    if (!response.ok) {
                        throw new Error("Save failed");
                    }

                    await loadTasks();

                } catch (error) {
                    saveButton.disabled = false;
                    status.textContent = "Could not save changes.";
                }
            });

            // Delete -> запазваме старото поведение
            deleteButton.addEventListener("click", async () => {
                if (!window.confirm(`Delete "${task.title}"?`)) {
                    return;
                }

                deleteButton.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "DELETE"
                    });

                    if (!response.ok) {
                        throw new Error("Delete failed");
                    }

                    await loadTasks();

                } catch (error) {
                    deleteButton.disabled = false;
                    status.textContent = "Could not delete task.";
                }
            });

            list.appendChild(card);
        }

    } catch (error) {
        status.textContent = "Cannot load tasks. Check the API.";
    }
}

     
document.getElementById("taskForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const input = document.getElementById("taskTitle");
        const title = input.value.trim();
        const description = document
                .getElementById("taskDescription")
                .value.trim();

        if (title === "") {
            return;
        }
//POST
        try {
            const response = await fetch("/api/tasks", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    isCompleted: false
                })
            });

            if (!response.ok) {
                throw new Error("Failed to create task");
            }

            input.value = "";
            document.getElementById("taskDescription").value = "";

            await loadTasks();

        } catch (error) {
            console.error("Add task error:", error);

            document.getElementById("status")
                .textContent = "Could not add task.";
        }
    });

    loadTasks();
    </script>
</body>
</html>
