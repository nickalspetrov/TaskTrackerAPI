
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            margin: 0;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 60px auto;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            color: #1e40af;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .task {
            padding: 15px;
            margin-top: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .completed {
            color: #059669;
        }

        .pending {
            color: #d97706;
        }
        
.task-form {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

.task-form input {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
}

.task-form input:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.task label {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.task label {
    flex: 1;
}

.delete-btn {
    background: #dc2626;
    color: white;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.delete-btn:hover {
    background: #b91c1c;
}

.delete-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.task {
    display: block;
}

.task-header {
    display: flex;
    align-items: center;
    gap: 10px;
}

.task-title {
    flex: 1;
    text-align: left;
    color: #1f2937;
    background: transparent;
    padding: 8px 0;
    font-size: 15px;
    font-weight: 600;
}

.task-title:hover {
    background: transparent;
    color: #2563eb;
}

.task-title.done {
    text-decoration: line-through;
    opacity: 0.55;
}

.task-description {
    margin: 12px 0 4px 28px;
    color: #475569;
    white-space: pre-wrap;
    line-height: 1.5;
}

.edit-btn {
    background: #e8efff;
    color: #1d4ed8;
    padding: 8px 12px;
}

.edit-btn:hover {
    background: #dbeafe;
}

.edit-form {
    margin-top: 14px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 8px;
    display: grid;
    gap: 10px;
}

.edit-form input,
.edit-form textarea {
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font: inherit;
}

.edit-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.cancel-btn {
    background: #64748b;
}

[hidden] {
    display: none !important;
}

.task-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 25px 0;
}

.task-form textarea {
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font: inherit;
    resize: vertical;
}

.task-form button {
    align-self: flex-start;
}


/* Wider layout for the Kanban board */
.container {
    max-width: 1100px;
}

/* Two-column board */
.board {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
    margin-top: 25px;
}

.board-column {
    background: #e9eef6;
    padding: 18px;
    border-radius: 12px;
    min-width: 0;
    min-height: 250px;
}

.board-column h2 {
    font-size: 18px;
    margin: 0 0 18px;
    color: #334155;
}

/* Individual task cards */
.task-column .task {
    background: white;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 2px 6px #00000008;
}

.task-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
}

/* Mobile layout */
@media (max-width: 700px) {
    .board {
        grid-template-columns: 1fr;
    }
}

/* THEME TOGGLE BUTTON */

.theme-toggle {
    background: #e2e8f0;
    color: #1e293b;
    border: 1px solid #cbd5e1;
    margin-bottom: 15px;
    font-weight: 600;
}

.theme-toggle:hover {
    background: #cbd5e1;
}

/* SMOOTH TRANSITIONS */

body,
.card,
.board-column,
.task,
.edit-form,
input,
textarea {
    transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
}

/* DARK MODE */

html[data-theme="dark"] {
    color-scheme: dark;
}

html[data-theme="dark"] body {
    background: #0b1220;
    color: #e5e7eb;
}

html[data-theme="dark"] .card {
    background: #111827;
    box-shadow: 0 5px 20px #00000030;
}

html[data-theme="dark"] h1 {
    color: #93c5fd;
}

/* Kanban columns */

html[data-theme="dark"] .board-column {
    background: #1e293b;
}

html[data-theme="dark"] .board-column h2 {
    color: #e2e8f0;
}

/* Task cards */

html[data-theme="dark"] .task,
html[data-theme="dark"] .task-column .task {
    background: #0f172a;
    border-color: #334155;
    color: #e5e7eb;
}

html[data-theme="dark"] .task-title {
    color: #f1f5f9;
    background: transparent;
}

html[data-theme="dark"] .task-title:hover {
    color: #93c5fd;
    background: transparent;
}

html[data-theme="dark"] .task-description,
html[data-theme="dark"] #status,
html[data-theme="dark"] .card > p {
    color: #94a3b8;
}

/* Edit form */

html[data-theme="dark"] .edit-form {
    background: #172033;
}

/* Form fields */

html[data-theme="dark"] .task-form input,
html[data-theme="dark"] .task-form textarea,
html[data-theme="dark"] .edit-form input,
html[data-theme="dark"] .edit-form textarea {
    background: #0b1220;
    color: #f1f5f9;
    border-color: #475569;
}

html[data-theme="dark"] input::placeholder,
html[data-theme="dark"] textarea::placeholder {
    color: #94a3b8;
}

/* Edit button */

html[data-theme="dark"] .edit-btn {
    background: #1e3a8a;
    color: #dbeafe;
}

html[data-theme="dark"] .edit-btn:hover {
    background: #1d4ed8;
}

/* Theme button */

html[data-theme="dark"] .theme-toggle {
    background: #273449;
    color: #f8fafc;
    border-color: #475569;
}

html[data-theme="dark"] .theme-toggle:hover {
    background: #334155;
}


/* Three-column Kanban board */

.container {
    max-width: 1250px;
}

.board {
    grid-template-columns: repeat(3, minmax(0, 1fr));
}

/* Task status dropdown */

.status-select {
    padding: 7px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: white;
    color: #334155;
    font: inherit;
    font-size: 12px;
    max-width: 100%;
}

/* Dark mode support */

html[data-theme="dark"] .status-select {
    background: #0b1220;
    color: #f1f5f9;
    border-color: #475569;
}

/* Small screens */

@media (max-width: 900px) {
    .board {
        grid-template-columns: 1fr;
    }
}

/* DRAG & DROP */

.drag-handle {
    cursor: grab;
    font-size: 22px;
    color: #64748b;
    user-select: none;
    padding: 2px 5px;
}

.drag-handle:active {
    cursor: grabbing;
}

.task.dragging {
    opacity: 0.45;
}

.task-column {
    min-height: 180px;
    border-radius: 10px;
    transition: background-color 0.2s ease;
}

.task-column.drag-over {
    background: rgba(59, 130, 246, 0.12);
    outline: 2px dashed #3b82f6;
    outline-offset: -3px;
}

/* Dark mode */

html[data-theme="dark"] .drag-handle {
    color: #94a3b8;
}

html[data-theme="dark"] .task-column.drag-over {
    background: rgba(96, 165, 250, 0.14);
}



    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h1>My Task Tracker</h1>
            
            <button type="button" id="themeToggle" class="theme-toggle">
                🌙 Dark Mode
            </button>

            <p>Manage your tasks with ASP.NET Core.</p>
             

<form id="taskForm" class="task-form">
    <input
        type="text"
        id="taskTitle"
        placeholder="Task title..."
        maxlength="200"
        required
    >

    <textarea
        id="taskDescription"
        placeholder="Task description..."
        rows="3"
    ></textarea>

    <button type="submit">
        Add Task
    </button>
</form>

   
            <button id="refreshBtn">
                Refresh Tasks
            </button>

            <p id="status"></p>

           
<div class="board">

    <!-- Колона за незавършени задачи -->
    <section class="board-column">
        <h2>To Do</h2>

        <div id="todoList" class="task-column"></div>
    </section>

<section class="board-column">
    <h2>In Progress</h2>

    <div id="progressList" class="task-column"></div>
</section>

    <!-- Колона за завършени задачи -->
    <section class="board-column">
        <h2>Done</h2>

        <div id="doneList" class="task-column"></div>
    </section>

</div>

        </div>
    </div>

    <script>
       
// Запазваме задачите, за да ги използваме при Drag & Drop
let tasksById = new Map();

// Една обща функция за промяна на статуса
async function changeTaskStatus(task, newStatus) {
    const response = await fetch(`/api/tasks/${task.id}`, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            title: task.title,
            description: task.description || "",
            status: newStatus,
            isCompleted: newStatus === "Done"
        })
    });

    if (!response.ok) {
        const message = await response.text();
        throw new Error(`HTTP ${response.status}: ${message}`);
    }

    await loadTasks();
}

async function loadTasks() {
    const todoList = document.getElementById("todoList");
const doneList = document.getElementById("doneList");
const progressList = document.getElementById("progressList");
const status = document.getElementById("status");


    todoList.replaceChildren();
    doneList.replaceChildren();
    progressList.replaceChildren();

    status.textContent = "Loading tasks...";

    try {
        const response = await fetch("/api/tasks");

        if (!response.ok) {
            throw new Error("Could not load tasks");
        }

        const tasks = await response.json();
        tasksById = new Map(tasks.map(task => [task.id, task]));
        status.textContent = `${tasks.length} tasks found`;

        for (const task of tasks) {
            const card = document.createElement("div");
            card.className = "task";

            // HTML структура за всяка задача
            card.innerHTML = `
                
                   
                        <div class="task-header">

                            <!-- Drag & Drop -->
                            <span class="drag-handle"
                                draggable="true"
                                title="Drag task to another column">⠿</span>

                            <!-- Един checkbox -->
                            <input type="checkbox" class="task-check">

                            <!-- Заглавие -->
                            <button type="button" class="task-title"></button>

                            <!-- Статус -->
                            <select class="status-select">
                                <option value="ToDo">To Do</option>
                                <option value="InProgress">In Progress</option>
                                <option value="Done">Done</option>
                            </select>

                            <!-- Бутони -->
                            <button type="button" class="edit-btn">Edit</button>
                            <button type="button" class="delete-btn">Delete</button>

                        </div>


                <p class="task-description" hidden></p>

                <form class="edit-form" hidden>
                    <input type="text" class="edit-title"
                           maxlength="200" required>

                    <textarea class="edit-description"
                              rows="3"
                              placeholder="Task description..."></textarea>

                    <div class="edit-actions">
                        <button type="submit" class="save-btn">Save</button>
                        <button type="button" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            `;
              
const dragHandle = card.querySelector(".drag-handle");

dragHandle.addEventListener("dragstart", (event) => {
    event.dataTransfer.setData(
        "text/plain",
        String(task.id)
    );

    event.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
});

dragHandle.addEventListener("dragend", () => {
    card.classList.remove("dragging");

    document.querySelectorAll(".task-column")
        .forEach(column => {
            column.classList.remove("drag-over");
        });
});
      
            const checkbox = card.querySelector(".task-check");
            const title = card.querySelector(".task-title");
            const description = card.querySelector(".task-description");
            const editButton = card.querySelector(".edit-btn");
            const statusSelect = card.querySelector(".status-select");
            const deleteButton = card.querySelector(".delete-btn");

            const form = card.querySelector(".edit-form");
            const titleInput = card.querySelector(".edit-title");
            const descriptionInput = card.querySelector(".edit-description");
            const cancelButton = card.querySelector(".cancel-btn");
            const saveButton = card.querySelector(".save-btn");

            // Показваме реалните данни от базата
            checkbox.checked = task.isCompleted;
            statusSelect.value = task.status;
            checkbox.setAttribute("aria-label", `Complete ${task.title}`);
            title.textContent = task.title;
            title.classList.toggle("done", task.isCompleted);

            description.textContent =
                task.description || "No description yet.";

            // Натискане на заглавието -> описание
            title.addEventListener("click", () => {
                description.hidden = !description.hidden;
            });
            

statusSelect.addEventListener("change", async () => {
    statusSelect.disabled = true;

    try {
        await changeTaskStatus(task, statusSelect.value);
    } catch (error) {
        console.error("Status update error:", error);

        statusSelect.value = task.status;
        statusSelect.disabled = false;

        document.getElementById("status").textContent =
            "Could not change task status.";
    }
});

    
            // Checkbox -> PUT
            checkbox.addEventListener("change", async () => {
                checkbox.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: task.title,
                            description: task.description || "",
                            status: checkbox.checked ? "Done" : "ToDo",
                            isCompleted: checkbox.checked
                        })
                            });

                    if (!response.ok) {
                        throw new Error("Update failed");
                    }

                    await loadTasks();

                } catch (error) {
                    checkbox.checked = task.isCompleted;
                    checkbox.disabled = false;
                    status.textContent = "Could not update task.";
                }
            });

            // Edit -> показваме формата
            editButton.addEventListener("click", () => {
                titleInput.value = task.title;
                descriptionInput.value = task.description || "";

                form.hidden = false;
                description.hidden = true;
                titleInput.focus();
            });

            // Cancel -> затваряме формата
            cancelButton.addEventListener("click", () => {
                form.hidden = true;
            });

            // Save -> изпращаме PUT към API
            form.addEventListener("submit", async (event) => {
                event.preventDefault();

                const newTitle = titleInput.value.trim();
                const newDescription = descriptionInput.value.trim();

                if (!newTitle) {
                    return;
                }

                saveButton.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            title: newTitle,
                            status: task.status,
                            isCompleted: task.status === "Done"
                        })
                    });

                    if (!response.ok) {
                        throw new Error("Save failed");
                    }

                    await loadTasks();

                } catch (error) {
                    saveButton.disabled = false;
                    status.textContent = "Could not save changes.";
                }
            });

            // Delete -> запазваме старото поведение
            deleteButton.addEventListener("click", async () => {
                if (!window.confirm(`Delete "${task.title}"?`)) {
                    return;
                }

                deleteButton.disabled = true;

                try {
                    const response = await fetch(`/api/tasks/${task.id}`, {
                        method: "DELETE"
                    });

                    if (!response.ok) {
                        throw new Error("Delete failed");
                    }

                    await loadTasks();

                } catch (error) {
                    deleteButton.disabled = false;
                    status.textContent = "Could not delete task.";
                }
            });

            
         
            // Place each card in the correct column
            if (task.status === "Done") {
                doneList.appendChild(card);
            } else if (task.status === "InProgress") {
                progressList.appendChild(card);
            } else {
                todoList.appendChild(card);
            }


        }

    } catch (error) {
        status.textContent = "Cannot load tasks. Check the API.";
    }
}

// DROP ZONES

const dropZones = [
    { id: "todoList", status: "ToDo" },
    { id: "progressList", status: "InProgress" },
    { id: "doneList", status: "Done" }
];

for (const zone of dropZones) {
    const column = document.getElementById(zone.id);

    // Позволяваме пускане в колоната
    column.addEventListener("dragover", (event) => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";

        column.classList.add("drag-over");
    });

    // Премахваме осветяването
    column.addEventListener("dragleave", (event) => {
        if (!column.contains(event.relatedTarget)) {
            column.classList.remove("drag-over");
        }
    });

    // Потребителят пуска задачата
    column.addEventListener("drop", async (event) => {
        event.preventDefault();

        column.classList.remove("drag-over");

        const taskId = Number(
            event.dataTransfer.getData("text/plain")
        );

        const task = tasksById.get(taskId);

        if (!task || task.status === zone.status) {
            return;
        }

        try {
            await changeTaskStatus(task, zone.status);

        } catch (error) {
            console.error("Drag & Drop error:", error);

            document.getElementById("status").textContent =
                "Could not move task.";
        }
    });
}

     
document.getElementById("taskForm")
    .addEventListener("submit", async (event) => {

        event.preventDefault();

        const input = document.getElementById("taskTitle");
        const title = input.value.trim();
        const description = document
                .getElementById("taskDescription")
                .value.trim();

        if (title === "") {
            return;
        }
//POST
        try {
            const response = await fetch("/api/tasks", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    description: description,
                    status: "ToDo",
                    isCompleted: false
                })
            });

            if (!response.ok) {
                throw new Error("Failed to create task");
            }

            input.value = "";
            document.getElementById("taskDescription").value = "";

            await loadTasks();

        } catch (error) {
            console.error("Add task error:", error);

            document.getElementById("status")
                .textContent = "Could not add task.";
        }
    });
    

// THEME SWITCHER

const themeButton = document.getElementById("themeToggle");

// Read the previously selected theme
const savedTheme = localStorage.getItem("taskTrackerTheme");

// Default theme is light
document.documentElement.dataset.theme =
    savedTheme === "dark" ? "dark" : "light";

// Update the button text
function updateThemeButton() {
    const isDark =
        document.documentElement.dataset.theme === "dark";

    themeButton.textContent = isDark
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";

    themeButton.setAttribute(
        "aria-pressed",
        String(isDark)
    );
}

// Switch between the themes
themeButton.addEventListener("click", () => {

    const isDark =
        document.documentElement.dataset.theme === "dark";

    const newTheme = isDark ? "light" : "dark";

    document.documentElement.dataset.theme = newTheme;

    // Remember the choice
    localStorage.setItem("taskTrackerTheme", newTheme);

    updateThemeButton();
});

// Set the initial button label
updateThemeButton();

    loadTasks();
    </script>
</body>
</html>
